# 轻拼 LightCollage · 功能建议表单
name: 功能建议
description: 为「轻拼 LightCollage」提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请说明使用场景与期望效果，便于评估实现方式。

        - 提交前请先搜索 [已有 Issue](https://github.com/ryantxq/LightCollage/issues?q=is%3Aissue)，避免重复。
        - 本项目坚持「免安装、单文件 exe、不联网、不常驻后台」的定位，与定位冲突的建议可能不会被采纳。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认没有重复建议。
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 建议类型
      options:
        - 新功能
        - 现有功能改进
        - 右键菜单 / 安装体验
        - 界面与交互
        - 性能与兼容性
        - 其他
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？现在的做法有什么不便？
      placeholder: 例如：经常把 6 张手机照片拼成长图，希望记住上次的排列方向。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
      description: 你希望它如何工作？可以描述交互方式、参数或示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案（可选）
      description: 你考虑过的替代做法，或其他工具的处理方式。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 截图、参考链接等。
    validations:
      required: false
